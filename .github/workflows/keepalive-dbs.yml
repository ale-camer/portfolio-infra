name: External Free-Tier Databases Keepalive (MongoDB Atlas, Upstash Redis, Neon Postgres)

on:
  schedule:
    # Runs at 08:00 UTC on the 1st and 15th of every month (well within the 30-day inactivity window)
    - cron: "0 8 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  keepalive:
    name: Heartbeat MongoDB Atlas M0, Upstash Redis & Neon Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER || 'projects/953935962175/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc-provider' }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT || 'sa-infra-terraform@gen-lang-client-0887473308.iam.gserviceaccount.com' }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python 3.12 & DB drivers
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight drivers
        run: |
          pip install --quiet "pymongo>=4.6.0" "redis>=5.0.0" "psycopg[binary]>=3.1.0"

      - name: Execute Read/Write Heartbeats & Send WhatsApp Report
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'gen-lang-client-0887473308' }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          NOSQL_JSON="$(gcloud secrets versions access latest --secret=portfolio-nosql-cache-urls --project="${GCP_PROJECT_ID}")"
          PG_URL="$(gcloud secrets versions access latest --secret=portfolio-postgres-url --project="${GCP_PROJECT_ID}")"
          export NOSQL_JSON PG_URL

          python3 - << 'EOF'
          import json
          import os
          import sys
          import time
          from datetime import datetime, timezone
          import psycopg
          import redis
          from pymongo import MongoClient

          sys.path.insert(0, "scripts")
          from notify_whatsapp import detect_trigger_label, send_whatsapp_notification

          t0 = time.perf_counter()
          now_iso = datetime.now(timezone.utc).isoformat()
          ts_utc = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          trigger = detect_trigger_label()

          nosql = json.loads(os.environ["NOSQL_JSON"])
          mongo_uri = nosql["MONGODB_URI"]
          redis_url = nosql["REDIS_URL"]
          raw_pg = os.environ["PG_URL"].strip()
          pg_url = json.loads(raw_pg).get("DATABASE_URL", raw_pg) if raw_pg.startswith("{") else raw_pg
          pg_url = pg_url.replace("postgresql+asyncpg://", "postgresql://").replace("postgresql+psycopg://", "postgresql://")

          statuses = {}

          # 1. MongoDB Atlas
          try:
              mc = MongoClient(mongo_uri, serverSelectionTimeoutMS=12000)
              db = mc["p04_financial_news"]
              db["_keepalive"].update_one(
                  {"_id": "atlas_heartbeat"},
                  {"$set": {"last_heartbeat_utc": now_iso}},
                  upsert=True,
              )
              doc = db["_keepalive"].find_one({"_id": "atlas_heartbeat"})
              assert doc and doc.get("last_heartbeat_utc") == now_iso
              statuses["mongo"] = "OK"
              print(f"[OK] MongoDB Atlas M0 heartbeat updated: {doc['last_heartbeat_utc']}")
          except Exception as exc:
              statuses["mongo"] = "FALLO"
              print(f"[ERROR] MongoDB Atlas: {exc}")

          # 2. Upstash Redis
          try:
              rc = redis.from_url(redis_url, socket_timeout=12)
              rc.set("_keepalive:heartbeat", now_iso)
              val = rc.get("_keepalive:heartbeat")
              assert val is not None
              statuses["redis"] = "OK"
              print(f"[OK] Upstash Redis heartbeat updated: {val.decode('utf-8')}")
          except Exception as exc:
              statuses["redis"] = "FALLO"
              print(f"[ERROR] Upstash Redis: {exc}")

          # 3. Neon PostgreSQL
          try:
              with psycopg.connect(pg_url, connect_timeout=12) as conn:
                  with conn.cursor() as cur:
                      cur.execute("SELECT 1;")
                      row = cur.fetchone()
                      assert row == (1,)
              statuses["postgres"] = "OK"
              print("[OK] Neon PostgreSQL heartbeat verified")
          except Exception as exc:
              statuses["postgres"] = "FALLO"
              print(f"[ERROR] Neon PostgreSQL: {exc}")

          duration_sec = time.perf_counter() - t0
          ok_count = sum(1 for v in statuses.values() if v == "OK")

          if ok_count == 3:
              msg = (
                  "🟢 *[BASES-DE-DATOS]* · Mantenimiento Quincenal OK\n"
                  f"_{ts_utc} · {duration_sec:.1f}s · {trigger}_\n\n"
                  "*Detalle de control:*\n"
                  f"> Bases activas: `{ok_count}/3`\n"
                  f"> MongoDB Atlas: `{statuses['mongo']}`\n"
                  f"> Upstash Redis: `{statuses['redis']}`\n"
                  f"> Neon PostgreSQL: `{statuses['postgres']}`"
              )
          else:
              msg = (
                  "🔴 *[BASES-DE-DATOS]* · Fallo en Base de Datos\n"
                  f"_{ts_utc} · {duration_sec:.1f}s · {trigger}_\n\n"
                  "*Diagnóstico:*\n"
                  f"> Bases activas: `{ok_count}/3`\n"
                  f"> MongoDB Atlas: `{statuses['mongo']}`\n"
                  f"> Upstash Redis: `{statuses['redis']}`\n"
                  f"> Neon PostgreSQL: `{statuses['postgres']}`"
              )

          send_whatsapp_notification(msg)
          if ok_count < 3:
              sys.exit(1)
          EOF
